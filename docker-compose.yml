services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_ops
    ports:
      - '5432:5432'
    volumes:
      - agent_ops_pgdata:/var/lib/postgresql/data

volumes:
  agent_ops_pgdata:
