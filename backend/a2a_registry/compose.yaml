services:
  postgres:
    image: postgres:16-alpine
    container_name: a2a-registry-postgres
    environment:
      POSTGRES_DB: a2a_registry
      POSTGRES_USER: a2a_registry
      POSTGRES_PASSWORD: a2a_registry_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2a_registry -d a2a_registry"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - a2a_registry_postgres:/var/lib/postgresql/data

volumes:
  a2a_registry_postgres:
